import javax.inject.Inject
import pgm.BuildPgmExtractor
import pgm.ExtractPgmDeclarations
import pgm.EmitPgmBindings
import pgm.BindingFingerprint

abstract class DownloadPgmFile extends DefaultTask {
    @Input
    abstract Property<String> getDownloadUrl()

    @OutputFile
    abstract RegularFileProperty getDestination()

    @TaskAction
    void download() {
        def target = destination.get().asFile
        target.parentFile.mkdirs()
        URI.create(downloadUrl.get()).toURL().withInputStream { input ->
            target.withOutputStream { output -> output << input }
        }
    }
}

abstract class GenerateLegacyPgmBindings extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOperations()

    @Internal
    abstract RegularFileProperty getLocalExecutable()

    @Internal
    abstract ConfigurableFileCollection getDownloadedExecutables()

    @Internal
    abstract Property<String> getExecutableName()

    @InputFiles
    abstract ConfigurableFileCollection getHeaders()

    @OutputDirectory
    abstract DirectoryProperty getGeneratedSources()

    @TaskAction
    void generate() {
        def executable = localExecutable.orNull?.asFile
        if (executable == null) {
            def matches = downloadedExecutables.files.findAll { it.name == executableName.get() }
            if (matches.size() != 1) {
                throw new GradleException("Expected exactly one jextract executable, but found ${matches.size()}: $matches")
            }
            executable = matches.first()
        }
        execOperations.exec {
            commandLine executable, '--output', generatedSources.get().asFile,
                    '--target-package', 'org.lfenergy.pgm',
                    '--header-class-name', 'PowerGridModelC', *headers.files.toList()
        }
    }
}

def version = providers.provider { project.ext.pgmWheelVersion }
def pgmDir = layout.buildDirectory.dir('pgm').get()
def wheels = pgmDir.dir('download')
def headers = pgmDir.dir('headers')
def nativeLibraries = pgmDir.dir('lib')
def generatedSources = pgmDir.dir('generated-src')
def candidateSources = pgmDir.dir('portable-src')
def usePortable = providers.gradleProperty('pgmPortableBindings').map { it.toBoolean() }.getOrElse(false)

def platforms = [
    x86_64_macosx : ['macosx_13_0_x86_64', 'lib/libpower_grid_model_c.dylib', 'dylib'],
    arm64_macosx : ['macosx_13_0_arm64', 'lib/libpower_grid_model_c.dylib', 'dylib'],
    x86_64_windows: ['win_amd64', 'bin/power_grid_model_c.dll', 'dll'],
    arm64_linux  : ['manylinux_2_24_aarch64.manylinux_2_28_aarch64', 'lib64/libpower_grid_model_c.so', 'so'],
    x86_64_linux : ['manylinux_2_26_x86_64.manylinux_2_28_x86_64', 'lib64/libpower_grid_model_c.so', 'so']
]

def allLibraries = tasks.register('extractPGMNativeLibsFromWheels') {
    def wheelVersion = version.get()
    inputs.property('wheelVersion', wheelVersion)
    outputs.file(nativeLibraries.file('version'))
    doLast { nativeLibraries.file('version').asFile.write(wheelVersion) }
}
def wheelPrefix = 'power_grid_model/_core/power_grid_model_c'

platforms.each { slug, platform ->
    def (wheelTag, nativePath, extension) = platform
    def wheel = wheels.file("power_grid_model_${slug}.whl")
    def download = tasks.register("downloadPGMWheel_$slug", DownloadPgmFile) {
        def wheelVersion = version.get()
        downloadUrl.set("https://github.com/PowerGridModel/power-grid-model/releases/download/v${wheelVersion}/power_grid_model-${wheelVersion}-py3-none-${wheelTag}.whl")
        destination.set(wheel)
    }
    def extract = tasks.register("extractPGMNativeLibFromWheel_$slug", Copy) {
        dependsOn(download)
        def filename = "power_grid_model_c_${slug}.${extension}"
        outputs.file(nativeLibraries.file(filename))
        from(zipTree(wheel)) {
            include "$wheelPrefix/$nativePath"
            eachFile { path = filename }
        }
        includeEmptyDirs = false
        into(nativeLibraries)
    }
    allLibraries.configure { dependsOn(extract) }
}

def extractWheelHeaders = { String taskName, String slug, Directory output ->
    tasks.register(taskName, Sync) {
        dependsOn(tasks.named("downloadPGMWheel_$slug"))
        def includeRoot = "$wheelPrefix/include"
        from(zipTree(wheels.file("power_grid_model_${slug}.whl"))) {
            include "$includeRoot/**/*.h"
            eachFile { path = path.substring(includeRoot.length() + 1) }
        }
        includeEmptyDirs = false
        into(output)
    }
}
def extractHeaders = extractWheelHeaders('extractPGMHeaderFiles', 'x86_64_linux', headers)

def jextractDir = layout.buildDirectory.dir('jextract').get()
def jextractArchive = jextractDir.file('jextract.tar.gz')
def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def arm = arch in ['aarch64', 'arm64']
def toolPlatform
if (os.contains('linux')) {
    toolPlatform = arm ? 'linux_aarch64' : 'linux_x64'
} else if (os.contains('mac')) {
    toolPlatform = arm ? 'macos_aarch64' : 'macos_x64'
} else if (os.contains('windows') && arch in ['amd64', 'x86_64']) {
    toolPlatform = 'windows_x64'
} else {
    throw new GradleException("Unsupported platform: $os / $arch")
}
def jextractUrl = providers.gradleProperty("jextract_${toolPlatform}_url").get()
def downloadJextract = tasks.register('downloadJextract', DownloadPgmFile) {
    downloadUrl.set(jextractUrl)
    destination.set(jextractArchive)
}
def extractJextract = tasks.register('extractJextract', Copy) {
    dependsOn(downloadJextract)
    from(tarTree(resources.gzip(jextractArchive.asFile)))
    into(jextractDir)
}
def localJextract = providers.gradleProperty('jextract_bin').orNull
def generateLegacy = tasks.register('generateLegacyPGMBindings', GenerateLegacyPgmBindings) {
    if (localJextract != null) {
        localExecutable.set(file(localJextract))
    } else {
        dependsOn(extractJextract)
        downloadedExecutables.from(fileTree(jextractDir) { include '**/bin/*' })
        executableName.set(os.contains('windows') ? 'jextract.exe' : 'jextract')
    }
    dependsOn(extractHeaders)
    getHeaders().from(headers.file('power_grid_model_c.h'), headers.file('power_grid_model_c/dataset_definitions.h'))
    getGeneratedSources().set(generatedSources)
}

def hostSlug = [
    linux_aarch64: 'arm64_linux', linux_x64: 'x86_64_linux',
    macos_aarch64: 'arm64_macosx', macos_x64: 'x86_64_macosx',
    windows_x64: 'x86_64_windows'
][toolPlatform]
def nativeHeaders = pgmDir.dir("headers-${hostSlug}")
def extractNativeHeaders = extractWheelHeaders('extractNativePGMHeaders', hostSlug, nativeHeaders)
def llvmRoot = providers.gradleProperty('pgmLlvmDir').orElse(providers.environmentVariable('PGM_LLVM_DIR'))
def nativeSource = layout.projectDirectory.dir('buildSrc/src/main/native/pgm-bindings')
def nativeTool = pgmDir.dir('native-tool')
def executable = nativeTool.file(os.contains('windows') ? 'bin/pgm-extract.exe' : 'bin/pgm-extract')
def buildExtractor = tasks.register('buildPGMExtractor', BuildPgmExtractor) {
    source.set(nativeSource)
    llvmDirectory.set(llvmRoot)
    output.set(nativeTool)
}
def sdk = providers.gradleProperty('pgmClangSdk')
if (os.contains('mac')) {
    sdk = sdk.orElse(providers.exec { commandLine 'xcrun', '--show-sdk-path' }.standardOutput.asText.map { it.trim() })
}
def inspect = tasks.register('inspectPGMDeclarations', ExtractPgmDeclarations) {
    dependsOn(buildExtractor, extractNativeHeaders)
    extractor.set(executable)
    headerDirectory.set(nativeHeaders)
    sdkDirectory.set(sdk)
    windows.set(os.contains('windows'))
    llvmDirectory.set(llvmRoot)
    platform.set(hostSlug)
    wheelVersion.set(version.get())
    inventory.set(pgmDir.file('declarations.json'))
}
def generateCandidate = tasks.register('generatePortablePGMBindings', EmitPgmBindings) {
    inventory.set(inspect.flatMap { it.inventory })
    output.set(candidateSources)
}
def generate = tasks.register('generatePGMBindings') {
    dependsOn(usePortable ? generateCandidate : generateLegacy)
}
def referencePath = providers.gradleProperty('pgmBindingReference').orNull
tasks.register('fingerprintPGMBindings', BindingFingerprint) {
    inventory.set(inspect.flatMap { it.inventory })
    sourceDirectory.set(generateCandidate.flatMap { it.output })
    wheelVersion.set(version.get())
    destination.set(pgmDir.file('binding-fingerprint.json'))
    if (referencePath != null) {
        reference.set(layout.projectDirectory.file(referencePath))
    }
}

plugins.withId('java') {
    sourceSets.main.java.srcDir(usePortable ? candidateSources : generatedSources)
    sourceSets.main.resources.srcDir(nativeLibraries)
    tasks.named('compileJava') { dependsOn(generate) }
    tasks.named('processResources') { dependsOn(allLibraries) }
}
